
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMAICA SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101810;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 24px 20px;
    background: linear-gradient(135deg, #193d25, #102016);
    border-bottom: 3px solid #e4c33e;
}

.logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #e8ca42;
}

.subtitle {
    color: #b5c4b5;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 7px;
}

.banner {
    margin: 20px;
    padding: 25px 20px;
    border-radius: 18px;
    background: linear-gradient(120deg, #1c542e, #183b25);
}

.banner h1 {
    font-size: 27px;
    margin: 0 0 10px;
}

.banner p {
    color: #d2dfd0;
    line-height: 1.5;
}

.section {
    padding: 0 20px;
    margin-top: 28px;
}

.section h2 {
    font-size: 20px;
}

.categories {
    display: flex;
    gap: 10px;
}

.category {
    flex: 1;
    padding: 14px 5px;
    text-align: center;
    background: #202a21;
    border-radius: 12px;
    font-size: 12px;
}

.products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.product {
    background: #202a21;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #344735;
}

.product-icon {
    font-size: 36px;
    margin-bottom: 12px;
}

.product h3 {
    font-size: 15px;
    min-height: 35px;
}

.description {
    color: #aab8aa;
    font-size: 12px;
    line-height: 1.4;
    min-height: 48px;
}

.price {
    color: #e9ca43;
    font-weight: bold;
    margin: 12px 0;
}

.buy {
    width: 100%;
    padding: 11px 5px;
    background: #34864a;
    border: none;
    border-radius: 9px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.buy:active {
    transform: scale(.97);
}

.cart {
    margin: 25px 20px;
    padding: 18px;
    border: 1px solid #e4c33e;
    border-radius: 15px;
    background: #202a21;
}

.cart h2 {
    margin-top: 0;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #344735;
    font-size: 13px;
}

.cart-total {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    font-weight: bold;
}

.cart-total span:last-child {
    color: #e9ca43;
}

.checkout {
    width: 100%;
    margin-top: 17px;
    padding: 14px;
    background: #e4c33e;
    color: #152018;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    cursor: pointer;
}

.empty {
    color: #9aaa9a;
    font-size: 13px;
}

footer {
    padding: 30px 15px;
    text-align: center;
    color: #829182;
    font-size: 11px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🇯🇲 JAMAICA <span>SHOP</span></div>
    <div class="subtitle">GOOD VIBES · DIGITAL GOODS</div>
</header>

<div class="banner">
    <h1>Welcome to Jamaica! 🌴</h1>
    <p>Discover our digital collection.<br>
    Choose your products and add them to your cart.</p>
</div>

<div class="section">
    <h2>Categories</h2>
    <div class="categories">
        <div class="category">🎨 Templates</div>
        <div class="category">✨ New</div>
        <div class="category">🔥 Popular</div>
    </div>
</div>

<div class="section">
    <h2>Our products</h2>
    <div class="products" id="products"></div>
</div>

<div class="cart" id="cart">
    <h2>🛒 Your cart</h2>
    <div id="cart-items">
        <p class="empty">Your cart is empty.</p>
    </div>
    <div class="cart-total">
        <span>Total</span>
        <span id="total">0.00 USDT</span>
    </div>
    <button class="checkout" onclick="checkout()">
        CONTINUE
    </button>
</div>

<footer>
    🇯🇲 JAMAICA SHOP<br><br>
    GOOD VIBES ONLY
</footer>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
}

const products = [
    {
        id: 1,
        name: "Design Templates",
        icon: "🎨",
        description: "Digital design template collection.",
        price: 5
    },
    {
        id: 2,
        name: "Wallpaper Pack",
        icon: "🌴",
        description: "A collection of stylish wallpapers.",
        price: 3
    },
    {
        id: 3,
        name: "Social Media Kit",
        icon: "📱",
        description: "Ready-to-use social media graphics.",
        price: 8
    },
    {
        id: 4,
        name: "Creator Bundle",
        icon: "🔥",
        description: "A bundle of digital creator resources.",
        price: 12
    }
];

const cart = {};

function renderProducts() {
    const container = document.getElementById("products");

    container.innerHTML = products.map(product => `
        <div class="product">
            <div class="product-icon">${product.icon}</div>
            <h3>${product.name}</h3>
            <div class="description">${product.description}</div>
            <div class="price">${product.price.toFixed(2)} USDT</div>
            <button class="buy" onclick="addToCart(${product.id})">
                ADD TO CART
            </button>
        </div>
    `).join("");
}

function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    renderCart();

    if (tg) {
        tg.HapticFeedback?.impactOccurred("light");
    }
}

function renderCart() {
    const container = document.getElementById("cart-items");
    let total = 0;
    let html = "";

    products.forEach(product => {
        const quantity = cart[product.id] || 0;

        if (quantity > 0) {
            const subtotal = product.price * quantity;
            total += subtotal;

            html += `
                <div class="cart-item">
                    <span>${product.name} × ${quantity}</span>
                    <span>${subtotal.toFixed(2)} USDT</span>
                </div>
            `;
        }
    });

    container.innerHTML = html || '<p class="empty">Your cart is empty.</p>';
    document.getElementById("total").textContent =
        total.toFixed(2) + " USDT";
}

function checkout() function checkout() {
    const selected = products
        .filter(product => cart[product.id])
        .map(product => ({
            id: product.id,
            quantity: cart[product.id]
        }));

    if (selected.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    const tg = window.Telegram.WebApp;

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({
            items: selected
        }));
    } else {
        alert("Please open the shop through our Telegram bot.");
    }
}

renderProducts();
renderCart();
</script>

</body>
</html>
